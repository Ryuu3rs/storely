[project]
name = "mystore"
description = "A Microsoft Store replacement for Windows that doesn't jam: browse, install and update Store apps."
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = { attr = "storemgr.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"
