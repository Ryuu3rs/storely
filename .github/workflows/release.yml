name: Release

# Push a tag like v1.3.0. Both installers are built natively (PyInstaller can't cross-build), get a build-provenance
# attestation, and are attached to a DRAFT release. Updates are signed with Storely's own Ed25519 key, which stays on
# the maintainer's PC: `python tools/sign_release.py --publish v1.3.0` there checks each installer's attestation
# (it must have been built by this workflow from this repo), signs, and publishes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Inno Setup (pinned)
        run: choco install innosetup --version 6.7.1 -y --no-progress
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - name: Version matches tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (& dist\Storely\storely-cli.exe --version) -replace '^Storely ', ''
          if ("v$v" -ne $env:TAG) { throw "built $v but the tag is $env:TAG" }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Storely-Setup-*-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: dist/Storely-Setup-*-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write # only this job can create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?\r?\n(.*?)(?=^## |\z)")
          ($m.Success ? $m.Groups[1].Value.Trim() : "Storely $v") | Set-Content notes.md
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Storely $TAG" --notes-file notes.md --draft
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*
