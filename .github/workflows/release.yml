name: Release

# Push a tag like v1.2.0. Both installers are built natively (PyInstaller can't cross-build), then attached to a
# DRAFT release. Updates are signed with Storely's own Ed25519 key, which normally stays on the maintainer's PC:
# run `python tools/sign_release.py --publish v1.2.0` there to sign and publish. If the repository has the
# STORELY_SIGNING_KEY secret, this workflow signs and publishes by itself.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - name: Version matches tag
        shell: pwsh
        run: |
          $v = (& dist\Storely\storely-cli.exe --version) -replace '^Storely ', ''
          if ("v$v" -ne "${{ github.ref_name }}") { throw "built $v but the tag is ${{ github.ref_name }}" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/Storely-Setup-*-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[?$([regex]::Escape($v))\]?.*?\r?\n(.*?)(?=^## |\z)")
          ($m.Success ? $m.Groups[1].Value.Trim() : "Storely $v") | Set-Content notes.md
      - name: Sign (only if the key is stored here)
        id: sign
        shell: pwsh
        env:
          STORELY_SIGNING_KEY: ${{ secrets.STORELY_SIGNING_KEY }}
        run: |
          if (-not $env:STORELY_SIGNING_KEY) { "signed=false" >> $env:GITHUB_OUTPUT; exit 0 }
          python -m pip install --require-hashes -r requirements.lock
          python tools/release_key.py --from-env
          python tools/sign_release.py dist
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          $draft = if ("${{ steps.sign.outputs.signed }}" -eq "true") { @() } else { @("--draft") }
          gh release create "${{ github.ref_name }}" @files --title "Storely ${{ github.ref_name }}" --notes-file notes.md @draft
