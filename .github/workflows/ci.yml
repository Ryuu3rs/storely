name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install (hash-pinned)
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Lint
        run: python -m ruff check --select F,E9,B --output-format github .
      - name: Tests
        run: python -m pytest -q
      - name: Known vulnerabilities (everything pinned, build tools included)
        run: |
          python -m pip_audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
          python -m pip_audit -r requirements-arm64.lock --no-deps --disable-pip --progress-spinner off
