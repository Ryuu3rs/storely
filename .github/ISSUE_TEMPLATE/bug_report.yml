name: Something isn't working
description: An app won't install or update, Storely shows an error, or something looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. The exact error text helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Storely version
      description: Settings > About
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type winver
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: >-
        Settings > Open Storely's data folder > storely.log. Paste only the lines around the problem, and check them
        first - they contain file paths that include your Windows user name.
      render: text
